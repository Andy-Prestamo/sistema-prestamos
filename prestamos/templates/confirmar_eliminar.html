<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fce8e6; }
        .card { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-si { background: #d93025; color: white; padding: 10px 30px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-no { color: #5f6368; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚠️ ¿Estás seguro?</h2>
        <p>Vas a eliminar este registro permanentemente.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-si">SÍ, ELIMINAR</button>
            <a href="/" class="btn-no">Cancelar</a>
        </form>
    </div>
</body>
</html>
