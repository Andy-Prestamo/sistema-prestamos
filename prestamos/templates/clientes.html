<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Préstamos Luchito</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1a73e8; color: white; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 5px; font-size: 14px; display: inline-block; }
        .btn-azul { background: #1a73e8; color: white; }
        .btn-rojo { background: #d93025; color: white; }
        .btn-naranja { background: #f29900; color: white; }
        .nav { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/" class="btn btn-azul">🏠 Volver al Dashboard</a>
            <a href="/admin/prestamos/cliente/add/" class="btn btn-naranja">➕ Nuevo Cliente</a>
        </div>
        <h1>Gestión de Clientes</h1>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for cliente in clientes %}
                <tr>
                    <td>{{ cliente.nombre }}</td>
                    <td>{{ cliente.dni }}</td>
                    <td>{{ cliente.telefono }}</td>
                    <td>
                        <a href="/admin/prestamos/cliente/{{ cliente.id }}/change/" class="btn btn-naranja">✏️ Editar</a>
                        <a href="/admin/prestamos/cliente/{{ cliente.id }}/delete/" class="btn btn-rojo">🗑️ Borrar</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4">No hay clientes registrados.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
