<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes - Préstamos Luchito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding: 20px; color: #333; margin: 0; }
        .header { background: #5f6368; color: white; padding: 20px; text-align: center; margin: -20px -20px 30px -20px; }
        .contenedor { max-width: 1000px; margin: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; color: #5f6368; }
        .btn { padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s; display: inline-block; }
        .btn-nuevo { background: #1a73e8; color: white; padding: 12px 20px; }
        .btn-historial { background: #e8f0fe; color: #1a73e8; border: 1px solid #1a73e8; }
        .btn-edit { color: #34a853; margin-left: 10px; }
        .btn-delete { color: #d93025; margin-left: 10px; }
        .btn-volver { color: white; text-decoration: none; font-size: 16px; float: left; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'dashboard' %}" class="btn-volver">⬅ Volver</a>
        <h1>Nuestros Clientes</h1>
    </div>

    <div class="contenedor">
        <div class="top-bar">
            <h2>Directorio de Clientes</h2>
            <a href="{% url 'crear_cliente' %}" class="btn btn-nuevo">➕ Agregar Nuevo Cliente</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for cliente in clientes %}
                <tr>
                    <td><strong>{{ cliente.nombre }}</strong></td>
                    <td>{{ cliente.dni }}</td>
                    <td>{{ cliente.telefono }}</td>
                    <td>
                        <a href="{% url 'historial_cliente' cliente.id %}" class="btn btn-historial">📖 Ver Historial / Deuda</a>
                        
                        <a href="{% url 'editar_cliente' cliente.id %}" class="btn btn-edit" title="Editar">✏️</a>
                        <a href="{% url 'eliminar_cliente' cliente.id %}" class="btn btn-delete" title="Eliminar">🗑️</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" style="text-align: center; color: #999; padding: 30px;">
                        No hay clientes registrados todavía.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
